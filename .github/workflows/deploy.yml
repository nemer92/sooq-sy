
name: Deploy Sooq.Sy and Android Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Android Update
        run: CAPACITOR_BUILD=true npx vite build --outDir dist-native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package Android Update
        run: |
          mkdir -p dist/updates

          BUNDLE_ID="${GITHUB_SHA}"
          ZIP_NAME="bundle-${GITHUB_SHA}.zip"
          ZIP_PATH="dist/updates/${ZIP_NAME}"

          cd dist-native
          zip -r "../${ZIP_PATH}" .
          cd ..

          CHECKSUM=$(sha256sum "${ZIP_PATH}" | cut -d ' ' -f 1)

          cat > dist/updates/latest.json <<EOF
          {
            "bundleId": "${BUNDLE_ID}",
            "downloadUrl": "https://nemer92.github.io/sooq-sy/updates/${ZIP_NAME}",
            "checksum": "${CHECKSUM}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
