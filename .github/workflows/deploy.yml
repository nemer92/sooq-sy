
name: Deploy Sooq.Sy and Android Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Android Update
        run: CAPACITOR_BUILD=true npx vite build --outDir dist-native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package Android Update
        shell: bash
        run: |
          set -e

          mkdir -p dist/updates

          VERSION_FILE="updates/version.txt"

          if [ -f "$VERSION_FILE" ]; then
            VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          else
            VERSION="2.1"
          fi

          BUNDLE_ID="${GITHUB_SHA}"
          ZIP_NAME="bundle-${GITHUB_SHA}.zip"
          ZIP_PATH="dist/updates/${ZIP_NAME}"

          cd dist-native
          zip -r "../${ZIP_PATH}" .
          cd ..

          CHECKSUM=$(sha256sum "${ZIP_PATH}" | cut -d ' ' -f 1)

          cat > dist/updates/latest.json <<EOF
          {
            "version": "${VERSION}",
            "bundleId": "${BUNDLE_ID}",
            "downloadUrl": "https://nemer92.github.io/sooq-sy/updates/${ZIP_NAME}",
            "checksum": "${CHECKSUM}"
          }
          EOF

          echo "Android update version: ${VERSION}"
          echo "Bundle ID: ${BUNDLE_ID}"

      - name: Build Signed Android APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e

          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing RELEASE_KEYSTORE_PASSWORD}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD}"

          mkdir -p "$RUNNER_TEMP"

          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release-key.jks"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"

          export ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"

          VERSION_FILE="updates/version.txt"

          if [ -f "$VERSION_FILE" ]; then
            export ANDROID_VERSION_NAME="$(tr -d '[:space:]' < "$VERSION_FILE")"
          else
            export ANDROID_VERSION_NAME="2.1"
          fi

          echo "Checking Android signing variables..."

          for name in RELEASE_KEYSTORE_PATH RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD ANDROID_VERSION_CODE ANDROID_VERSION_NAME; do
            if [ -n "${!name}" ]; then
              echo "$name: OK"
            else
              echo "::error::$name is EMPTY"
              exit 1
            fi
          done

          echo "Checking keystore file..."
          ls -l "$RELEASE_KEYSTORE_PATH"

          echo "Building Android version: $ANDROID_VERSION_NAME"
          echo "Android version code: $ANDROID_VERSION_CODE"

          npx cap sync android

          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -a dist-native/. android/app/src/main/assets/public/

          chmod +x android/gradlew

          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace
          cd ..

          mkdir -p dist

          cp android/app/build/outputs/apk/release/app-release.apk dist/app.apk

          test -s dist/app.apk

          echo "APK SHA256:"
          sha256sum dist/app.apk

          echo "Signed APK created successfully"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout version file
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Increase version for next update
        shell: bash
        run: |
          set -e

          mkdir -p updates

          VERSION_FILE="updates/version.txt"

          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          else
            CURRENT_VERSION="2.1"
          fi

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d '.' -f 1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d '.' -f 2)

          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}"

          echo "$NEXT_VERSION" > "$VERSION_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VERSION_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Android version ${NEXT_VERSION}"
            git push origin main
          fi

          echo "Next Android version: ${NEXT_VERSION}"
